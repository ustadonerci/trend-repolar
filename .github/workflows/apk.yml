name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle testDebugUnitTest assembleDebug 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash
      # Log'lar girişsiz görünmüyor; hataları herkese açık annotation olarak yaz.
      - if: failure()
        run: grep -E "^e: |What went wrong|FAILED|Caused by|expected:" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
      - uses: actions/upload-artifact@v4
        with:
          name: trend-repolar-apk
          path: app/build/outputs/apk/debug/app-debug.apk
